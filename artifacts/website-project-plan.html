<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Website project plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --deep:#29454F; --atlantic:#006377; --yellow:#FFCE00; --sand:#F4E4BC; --mist:#86A9B9; --coral:#E8845E;
  --bg:#F7F9FA; --surface:#FFFFFF; --line:#E6EBEE; --line-strong:#B8C2C9; --muted:#6B7C85; --text:#29454F;
  --band:#29454F; --band-text:#FFFFFF; --band-muted:#B8C2C9;
  --chip-off:#F7F9FA; --chip-on:#006377; --chip-on-text:#FFFFFF; --done-bg:#FFFBEA; --late:#C2532A;
  --p-james:#006377; --p-matias:#29454F; --p-viviana:#E8845E; --p-none:#B8C2C9;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A1F; --surface:#18252B; --line:#2A363B; --line-strong:#3E4E55; --muted:#97A7AF; --text:#E6EBEE;
    --band:#1C3138; --band-text:#FFFFFF; --band-muted:#97A7AF;
    --chip-off:#0F1A1F; --chip-on:#2A8A9C; --chip-on-text:#0F1A1F; --done-bg:#232A1C; --late:#F0A07F;
    --p-james:#2A8A9C; --p-matias:#86A9B9; --p-viviana:#E8845E; --p-none:#3E4E55;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A1F; --surface:#18252B; --line:#2A363B; --line-strong:#3E4E55; --muted:#97A7AF; --text:#E6EBEE;
  --band:#1C3138; --band-text:#FFFFFF; --band-muted:#97A7AF;
  --chip-off:#0F1A1F; --chip-on:#2A8A9C; --chip-on-text:#0F1A1F; --done-bg:#232A1C; --late:#F0A07F;
  --p-james:#2A8A9C; --p-matias:#86A9B9; --p-viviana:#E8845E; --p-none:#3E4E55;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
[hidden]{display:none!important}

.band{background:var(--band);color:var(--band-text)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding:36px 0 28px}
.hero h1{margin:0;font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.1;letter-spacing:-.01em}
.hero p{margin:8px 0 0;color:var(--band-muted);max-width:56ch}
.overall{text-align:right}
.overall .num{font-size:clamp(48px,8vw,76px);font-weight:800;line-height:.9;color:var(--yellow);font-variant-numeric:tabular-nums}
.overall .lbl{color:var(--band-muted);font-size:13px;margin-top:6px}
.meter{height:10px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden;margin-bottom:22px}
.meter span{display:block;height:100%;background:var(--yellow);border-radius:5px;transition:width .35s ease}
.counts{display:flex;flex-wrap:wrap;gap:8px 28px;padding-bottom:22px;font-size:14px}
.counts b{font-size:20px;font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.counts span{color:var(--band-muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{white-space:nowrap;flex:none;border:0;background:none;color:var(--band-muted);padding:12px 18px 14px;font-weight:700;font-size:15px;cursor:pointer;border-radius:10px 10px 0 0}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--text)}

.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:22px 0 14px}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--deep);color:#fff}
.save{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--mist);display:inline-block}
.save[data-s="saving"] i{background:var(--yellow)}
.save[data-s="saved"] i{background:#3BA272}
.save[data-s="error"] i,.save[data-s="readonly"] i{background:var(--coral)}

.group-title{font-size:13px;font-weight:700;color:var(--muted);margin:22px 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden}
.row.done{background:var(--done-bg)}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.row.prog::before{background:var(--mist)}
.row.done::before{background:var(--yellow)}
.row-main{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:16px;align-items:center;padding:14px 16px 14px 22px}
.name{display:flex;flex-direction:column;gap:2px;min-width:0}
.name input{border:1px solid transparent;background:transparent;font-weight:700;font-size:16px;padding:3px 6px;margin-left:-7px;border-radius:6px;width:100%;min-width:0}
.name input:hover{border-color:var(--line)}
.name input:focus{border-color:var(--atlantic);background:var(--bg);outline:none}
.meta{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.meta input{border:1px solid transparent;background:transparent;padding:1px 6px;margin-left:-7px;border-radius:5px;color:var(--atlantic);font-weight:600;width:11ch}
.meta input:hover{border-color:var(--line)}
.meta input:focus{border-color:var(--atlantic);outline:none;background:var(--bg)}
.link{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.parts{display:flex;gap:6px}
.pcol{display:flex;flex-direction:column;align-items:center;gap:4px}
.part{display:flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--chip-off);border-radius:8px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.box{width:16px;height:16px;border-radius:4px;border:2px solid var(--line-strong);display:grid;place-items:center;flex:none}
.part[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-text)}
[aria-pressed="true"] > .box,[aria-checked="true"] > .box{background:var(--yellow);border-color:var(--yellow)}
[aria-pressed="true"] > .box::after,[aria-checked="true"] > .box::after{content:"";width:5px;height:9px;border:solid var(--deep);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.part.auto{cursor:default}
.part.auto[aria-pressed="false"]{border-style:dashed}
.part:disabled{cursor:default;opacity:.75}
.who{display:flex;gap:3px;min-height:18px;align-items:center;font-size:11px;color:var(--muted)}
.av{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex:none}
.av.james{background:var(--p-james)} .av.matias{background:var(--p-matias)} .av.viviana{background:var(--p-viviana)} .av.none{background:var(--p-none);color:var(--text)}
.pct{text-align:right;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.row.done .pct{color:var(--atlantic)}
.extra{display:none;padding:0 16px 16px 22px;gap:12px;flex-direction:column}
.row.open .extra{display:flex}
.extra textarea{width:100%;min-height:72px;resize:vertical;border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;background:var(--bg);font-size:14px}
.extra h3{font-size:13px;margin:4px 0 0;color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:4px}
.mini-task{display:flex;align-items:center;gap:10px;font-size:14px}
.actions{display:flex;justify-content:flex-end;gap:8px}
.danger{background:none;border:1px solid var(--line-strong);color:var(--late);border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.ghost{background:none;border:1px solid var(--line-strong);border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.empty{padding:28px;border:1px dashed var(--line-strong);border-radius:12px;color:var(--muted);text-align:center}

.add{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 48px;padding:16px;border:1px dashed var(--line-strong);border-radius:12px}
.field{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:10px 12px;min-width:0}
.add .field{flex:1 1 220px}
.add .field.sec{flex:0 1 170px}
.primary{background:var(--yellow);color:var(--deep);border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}
.ro .add,.ro .danger,.ro .composer,.ro .tedit{display:none}

/* tasks */
.composer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin:4px 0 8px;display:grid;gap:14px}
.composer h2{margin:0;font-size:17px;font-weight:800}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 170px 160px;gap:10px}
.lab{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-strong);background:var(--chip-off);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-text)}
.secgroup{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.secgroup:first-child{border-top:0}
.secgroup .sname{font-size:13px;font-weight:700;padding-top:5px}
.secgroup .link{display:block;margin-top:2px}
.pagepick{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 12px}
.cfoot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted)}
.task{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start}
.task.done{opacity:.72}
.task.done .ttitle{text-decoration:line-through;text-decoration-color:var(--muted)}
.tick{border:0;background:none;padding:2px 0 0;cursor:pointer;display:flex}
.tick .box{width:22px;height:22px;border-radius:6px}
.tick:disabled{cursor:default}
.ttitle{font-weight:700;font-size:15.5px}
.tmeta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--muted)}
.tag{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-weight:600;color:var(--text)}
.tag.part-tag{background:var(--sand);border-color:var(--sand);color:var(--deep)}
.late{color:var(--late);font-weight:700}
.tside{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tside select{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:13px;font-weight:600}
.tedit{display:flex;gap:10px}
.people{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 6px}
.person{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.person b{font-size:16px;font-variant-numeric:tabular-nums}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .overall{text-align:left}
  .row-main{grid-template-columns:minmax(0,1fr) 56px;row-gap:12px}
  .parts{grid-column:1 / -1;grid-row:2;flex-wrap:wrap}
  .pct{grid-column:2;grid-row:1}
  .crow{grid-template-columns:1fr 1fr}
  .crow .tt{grid-column:1 / -1}
  .task{grid-template-columns:auto minmax(0,1fr)}
  .tside{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap}
  .secgroup{grid-template-columns:1fr}
}

/* go-live + calendar */
.golive{display:inline-flex;align-items:center;gap:6px}
.golive input{width:auto;color:var(--text);font-weight:600}
.late-tag{color:var(--late);font-weight:700}
.tag.pg{cursor:pointer}
.tag.pg:hover{border-color:var(--atlantic)}
.duebox{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13.5px;background:var(--bg);min-height:42px;display:flex;align-items:center}
.detect{font-size:12.5px;color:var(--atlantic);font-weight:600;min-height:18px;margin-top:6px}
.calhead{display:flex;align-items:center;gap:10px}
.calhead h2{margin:0;font-size:20px;font-weight:800;min-width:9ch}
.calhead button{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 11px;font-weight:700;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--surface);font-size:12px;font-weight:700;color:var(--muted);padding:8px 10px}
.cal .day{background:var(--surface);min-height:108px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .day.out{background:var(--bg)}
.cal .day.out .dn{opacity:.45}
.cal .dn{font-size:12.5px;font-weight:700;color:var(--muted);padding:2px 4px}
.cal .day.today .dn{background:var(--yellow);color:var(--deep);border-radius:6px;align-self:flex-start}
.ev{display:block;width:100%;text-align:left;border:1px solid var(--line-strong);background:var(--chip-off);border-radius:6px;padding:4px 6px;font-size:12px;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:4px solid var(--line-strong)}
.ev.prog{border-left-color:var(--mist)}
.ev.done{background:var(--done-bg);border-left-color:var(--yellow)}
.ev.late{border-left-color:var(--late)}
.ev.task{border-style:dashed;border-left-style:solid;font-weight:500}
.ev small{font-weight:500;color:var(--muted)}
.agenda{display:none;flex-direction:column;gap:14px}
.agenda .ad{font-weight:800;font-size:14px;margin-bottom:6px}
.agenda .ev{white-space:normal;font-size:13.5px;padding:8px 10px;margin-bottom:4px}
.undated{margin-top:18px}
@media (max-width:760px){ .cal{display:none} .agenda{display:flex} }

@media (prefers-reduced-motion:reduce){.meter span{transition:none}}

/* db version additions */
.notice{margin:22px 0 0;padding:14px 16px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-size:14px}
.tag.auto-tag{background:var(--bg);border-style:dashed;color:var(--muted)}
.tnote{margin-top:6px;font-size:13px;color:var(--muted);max-width:75ch}
.pick{border:0;background:none;padding:2px 0 0;cursor:pointer;display:flex}
.pick .box{width:22px;height:22px;border-radius:50%}
.combine-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--atlantic);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.combine-bar .primary:disabled{opacity:.5;cursor:default}
.task.picked{border-color:var(--atlantic);box-shadow:0 0 0 2px var(--atlantic) inset}
.confirming{background:var(--late)!important;border-color:var(--late)!important;color:#fff!important;text-decoration:none!important;padding:2px 8px!important;border-radius:6px}
.duepick{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--text)}
.duepick input{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:3px 7px;font-size:13px;font-weight:600;cursor:pointer}
.duepick input:hover{border-color:var(--atlantic)}
.duepick.late{color:var(--late)}
.duepick.late input{border-color:var(--late);color:var(--late)}
.part.signoff{border-style:solid}
.part.signoff.locked{opacity:.55;cursor:not-allowed;border-style:dashed}
.part.signoff[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--deep)}
.part.signoff[aria-pressed="true"] > .box{background:var(--deep);border-color:var(--deep)}
.part.signoff[aria-pressed="true"] > .box::after{border-color:var(--yellow)}
.tag.signoff-tag{background:var(--yellow);border-color:var(--yellow);color:var(--deep)}
.ready-tag{color:var(--atlantic);font-weight:700}
.warn{color:var(--late);font-weight:600}
.pageurl{color:var(--atlantic);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.review-on{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:var(--yellow);color:var(--deep);font-weight:700;text-decoration:none}
.review-on:hover{filter:brightness(1.05)}
.smrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.smname{display:flex;flex-direction:column;min-width:0;flex:1 1 280px}
.smname b{font-size:14.5px}
.smname span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.smlinks{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:12.5px}
.review-off{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;border:1px dashed var(--line-strong);color:var(--muted);font-weight:600}
.rv{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg,#fff)}
.rv-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--deep);color:#fff}
.rv-bar b{font-size:14px;min-width:0;overflow-wrap:anywhere}
.rv-bar button{border:0;border-radius:999px;padding:6px 14px;background:var(--yellow);color:var(--deep);font:inherit;font-weight:700;cursor:pointer}
.rv-bar button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.rv iframe{flex:1 1 auto;width:100%;border:0;background:#fff}
.rv-msg{padding:24px 16px;color:var(--text)}
/* This week: the Wednesday-to-Wednesday cycle */
.row-main{grid-template-columns:minmax(0,1fr) auto}
.pstate{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;justify-content:flex-end;max-width:420px}
.lanechips{display:flex;flex-wrap:wrap;gap:4px}
.lc{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px 2px 3px;border-radius:999px;border:1px solid var(--line);background:var(--chip-off);color:var(--muted)}
.lc.l-ok{color:var(--atlantic);border-color:var(--atlantic)}
.lc.l-work{color:var(--late);border-color:var(--late)}
.chip.on{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-text)}
.seg-lbl{font-size:13px;font-weight:700;color:var(--muted);padding:0 6px 0 8px;align-self:center}
.stage{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);background:var(--surface);white-space:nowrap}
.stage.s-review{color:var(--text);border-color:var(--mist)}
.stage.s-work{color:var(--late);border-color:var(--late)}
.stage.s-ready{background:var(--yellow);border-color:var(--yellow);color:var(--deep)}
.stage.s-signed{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-text)}
.stage.s-live{background:var(--deep);border-color:var(--deep);color:#fff}
.weekhead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin:4px 0 16px}
.weekhead h2{margin:0;font-size:20px;font-weight:800}
.weekhead .hint{margin:4px 0 0;font-size:13.5px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;list-style:none;margin:0;padding:0;min-width:min(100%,420px)}
.strip li{display:flex;flex-direction:column;align-items:center;padding:6px 4px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;line-height:1.3}
.strip li b{font-size:12px;white-space:nowrap}
.strip li span{color:var(--muted)}
.strip li.past{opacity:.55}
.strip li.meet{background:var(--yellow);border-color:var(--yellow);color:var(--deep)}
.strip li.meet span{color:var(--deep)}
.strip li.now{outline:2px solid var(--atlantic);outline-offset:1px}
.you{display:flex;gap:10px;align-items:center;padding:12px 14px;margin:0 0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--atlantic)}
.you p{margin:0;font-size:14px}
.you .av{width:24px;height:24px;font-size:12px}
.wklist{display:flex;flex-direction:column;gap:14px}
.wk{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line-strong);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.wk.s-review{border-left-color:var(--mist)}
.wk.s-work{border-left-color:var(--late)}
.wk.s-ready{border-left-color:var(--yellow)}
.wk.s-signed,.wk.s-live{border-left-color:var(--chip-on)}
.wk-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.wk-title{min-width:0}
.wk-title h3{margin:0;font-size:17px;line-height:1.3}
.wk-links{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px}
.wk-links .review-on{padding:6px 14px;font-size:14px}
.wk-note{margin:0;font-size:14px;color:var(--muted)}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:10px}
.lane{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:8px;min-width:0}
.lane.mine{border-color:var(--atlantic);box-shadow:0 0 0 1px var(--atlantic) inset}
.lane-h{display:flex;align-items:center;gap:8px;font-size:14px}
.lane-h span{color:var(--muted);font-size:13px}
.ask{margin:0;font-size:13px;color:var(--muted)}
.brief{margin:0;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px dashed var(--line-strong);overflow-wrap:anywhere}
.states{display:flex;flex-wrap:wrap;gap:4px}
.states button{flex:1 1 auto;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 10px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.states button[aria-pressed="true"].st-todo{background:var(--line);color:var(--text);border-color:var(--line-strong)}
.states button[aria-pressed="true"].st-work{background:var(--late);border-color:var(--late);color:#fff}
.states button[aria-pressed="true"].st-ok{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-text)}
.states button:disabled{cursor:default}
.lane textarea{width:100%;min-height:58px;resize:vertical;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:14px}
.by{margin:0;font-size:12px;color:var(--muted)}
.wk-foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px}
.wk-foot p{margin:0;flex:1 1 260px}
.wk-foot .primary{padding:8px 16px}
.carry{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px}
.agenda-box{margin:22px 0 0;padding:16px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.agenda-box h2{margin:0 0 4px;font-size:16px}
.agenda-box div{display:flex;flex-direction:column;font-size:14px}
.agenda-box div span{color:var(--muted)}
.agenda-box .hint{margin:4px 0 0}
select.field{flex:1 1 280px}
.ev.meet{background:var(--yellow);border-color:var(--yellow);border-left-color:var(--deep);color:var(--deep)}
span.ev.meet{cursor:default}
@media (max-width:760px){
  .row-main{grid-template-columns:minmax(0,1fr)}
  .pstate{justify-content:flex-start;max-width:none}
  .strip{min-width:0;width:100%}
  .wk-head{flex-direction:column}
}
</style>

<div id="app"></div>
<script id="app-script">
(function(){
  var PARTS = [["layout","Layout & structure"],["imagery","Imagery"],["copy","Copy"]];
  var PART_KEYS = ["layout","imagery","copy"];
  var PART_SHORT = {layout:"Layout",imagery:"Imagery",copy:"Copy"};
  var PEOPLE = ["James","Matias","Viviana"];
  var PAGE_FILTERS = [["all","All"],["progress","In progress"],["ready","Ready for sign-off"],["todo","Not started"],["done","Complete"]];
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  // Pages and tasks live in the artifact's shared database (collections "pages" and "tasks"), one document each.
  var state = {pages:[], tasks:[], sitemap:null};
  var loaded = {pages:false, tasks:false};
  function blankDraft(){return {editing:null,combine:[],title:"",assignee:"",due:"",on:{pages:[],parts:[]},off:{pages:[],parts:[]}};}
  var ui = {tab:"week", wk:0, me:"", smFilter:"all", filter:"all", open:{}, who:"all", show:"open", pillar:"all", draft:blankDraft(), month:"", picking:false, picked:{}, confirm:""};
  var mode = "pending", db = null, inflight = 0, lastErr = "", deferred = false, confirmTimer = null;

  try{
    var v = JSON.parse(sessionStorage.getItem('wpp-ui')||"null");
    if(v){ ["tab","wk","smFilter","filter","open","who","show","pillar","month"].forEach(function(k){ if(v[k]!==undefined) ui[k]=v[k]; }); if(v.draft && v.draft.on){ ui.draft=v.draft; if(!ui.draft.combine) ui.draft.combine=[]; } }
  }catch(e){}
  if(["week","pages","calendar","sitemap"].indexOf(ui.tab)<0) ui.tab="week";
  if(ui.wk!==1) ui.wk=0;
  if(ui.filter && ["all","notbuilt","review","work","ready","signed","live"].indexOf(ui.filter)<0) ui.filter="all";
  try{ ui.me = localStorage.getItem('wpp-me')||""; }catch(e){}

  /* ---------- helpers ---------- */
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  // Task notes: ecoveritas.com and claude.ai addresses become links (text is escaped first).
  function linkify(s){return esc(s).replace(/https:\/\/(?:www\.ecoveritas\.com|claude\.ai)\/[^\s<]*[^\s<.,;:)]/g,function(u){return '<a class="pageurl" href="'+u+'" target="_blank" rel="noopener">'+u+'</a>';});}
  // Review copies live inside this artifact (reviews/<page>.html), so anyone who can open the plan can open them;
  // older separate review artifacts on claude.ai still work. Anything else is ignored.
  function reviewLink(u,label){ var h=reviewHref(u); if(!h) return ""; return /^reviews\//.test(h) ? '<a class="review-on" href="'+esc(h)+'" data-review="'+esc(h)+'">'+label+'</a>' : '<a class="review-on" href="'+esc(h)+'" target="_blank" rel="noopener">'+label+'</a>'; }
  function reviewHref(u){ u = String(u||""); return /^reviews\/[a-z0-9-]+\.html$/.test(u) || /^https:\/\/claude\.ai\//.test(u) ? u : ""; }
  function pageById(id){for(var i=0;i<state.pages.length;i++) if(state.pages[i].id===id) return state.pages[i]; return null;}
  function taskById(id){for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].id===id) return state.tasks[i]; return null;}
  function isSignoff(t){return t.kind==="signoff";}
  function tasksFor(pid, part){return state.tasks.filter(function(t){return (t.pages||[]).indexOf(pid)>=0 && (!part || (t.parts||[]).indexOf(part)>=0);});}
  function partDone(p, part){var ts=tasksFor(p.id,part); return ts.length ? ts.every(function(t){return t.done;}) : !!p[part];}
  function done(p){return PARTS.filter(function(k){return partDone(p,k[0]);}).length;}
  // Sign-off is its own stage: it opens once layout, imagery and copy are all done, and the page is complete when it's ticked.
  function live(t){ if(!isSignoff(t)) return true; var p=pageById((t.pages||[])[0]); return !!(p && pillarsDone(p)); }
  function signoffId(pid){return "signoff-"+pid;}
  function signoffTask(p){return taskById(signoffId(p.id));}
  function pillarsDone(p){return done(p)===3;}
  function signedOff(p){var t=signoffTask(p); return pillarsDone(p) && !!(t && t.done);}
  function stages(p){return done(p)+(signedOff(p)?1:0);}
  function pct(p){return Math.round(stages(p)/4*100);}
  function status(p){ if(signedOff(p)) return "done"; if(pillarsDone(p)) return "ready"; return done(p)===0?"todo":"progress"; }
  function missingPillars(p){return PARTS.filter(function(k){return !partDone(p,k[0]);}).map(function(k){return PART_SHORT[k[0]].toLowerCase();});}
  function av(name){var n=(name||"").toLowerCase(); return '<span class="av '+(n||"none")+'" title="'+esc(name||"Unassigned")+'">'+(name?name[0]:"?")+'</span>';}
  function pad(n){return String(n).padStart(2,"0");}
  function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function today(){return iso(new Date());}
  function fmtDate(s){if(!s) return ""; var d=new Date(s+"T00:00:00"); return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});}
  function fmtLong(s){var d=new Date(s+"T00:00:00"); return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"long"});}
  function pageLate(p){var st=stage(p); return p.goLive && p.goLive<today() && st!=="signed" && st!=="live";}
  function uniq(a){return a.filter(function(x,i){return a.indexOf(x)===i;});}
  // A task's deadline is the earliest go-live date among its pages; a manual date is used only when none of them has one.
  function taskDue(t){
    var best="", from=[];
    (t.pages||[]).map(pageById).forEach(function(p){
      if(!p || !p.goLive) return;
      if(!best || p.goLive<best){ best=p.goLive; from=[p.name]; } else if(p.goLive===best) from.push(p.name);
    });
    if(t.dueLocked && t.due) return {date:t.due, from:from, derived:false, override:true, goLive:best};
    return best ? {date:best, from:from, derived:true} : {date:t.due||"", from:[], derived:false};
  }
  function sections(){
    var base=["Core","Services","Compliance","Regions","Sectors","Resources","Other"];
    state.pages.forEach(function(p){ if(p.section && base.indexOf(p.section)<0) base.push(p.section); });
    return base;
  }

  /* ---------- reading pages and parts out of a task title ---------- */
  function norm(s){return " "+String(s).toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim()+" ";}
  function detect(title){
    var text = norm(title), pages = [], parts = [];
    state.pages.slice().sort(function(a,b){return b.name.length-a.name.length;}).forEach(function(p){
      var n = norm(p.name); if(n.trim().length<2) return;
      var at = text.indexOf(n);
      if(at>=0){ pages.push({id:p.id,at:at}); text = text.split(n).join(" "+"~".repeat(n.length-2)+" "); }
    });
    pages = pages.sort(function(a,b){return a.at-b.at;}).map(function(x){return x.id;});
    var t = title.toLowerCase();
    if(/imag|photo|picture|visual|graphic|icon/.test(t)) parts.push("imagery");
    if(/\bcopy|writ|wording|content|text/.test(t)) parts.push("copy");
    if(/layout|structure|wirefram|build|design|block/.test(t)) parts.push("layout");
    parts.sort(function(a,b){return PART_KEYS.indexOf(a)-PART_KEYS.indexOf(b);});
    return {pages:pages, parts:parts, approval:/approv|sign[\s-]*off/.test(t)};
  }
  function sel(d){
    var det = detect(d.title);
    function merge(k){
      var out = det[k].concat(d.on[k]).filter(function(x,i,a){return a.indexOf(x)===i && d.off[k].indexOf(x)<0;});
      if(k==="pages") out = out.filter(function(id){return pageById(id);});
      return out;
    }
    var parts = merge("parts"); parts.sort(function(a,b){return PART_KEYS.indexOf(a)-PART_KEYS.indexOf(b);});
    return {pages:merge("pages"), parts:parts, det:det};
  }
  function togglePick(d,k,val,isOn){
    function rm(a){var i=a.indexOf(val); if(i>=0) a.splice(i,1);}
    if(isOn){ rm(d.on[k]); if(d.off[k].indexOf(val)<0) d.off[k].push(val); }
    else { rm(d.off[k]); if(d.on[k].indexOf(val)<0) d.on[k].push(val); }
  }

  /* ---------- saving: one document per write, one write at a time per document ---------- */
  var chains = {}, fieldTimers = {};
  function ro(){return mode!=="live";}
  function write(path, fn){
    if(!db || ro()) return;
    inflight++; setSave("saving");
    chains[path] = (chains[path]||Promise.resolve()).then(function(){ return fn(db.doc(path)); }).then(function(){
      inflight--; if(!inflight) setSave("saved");
    }, function(err){
      inflight--;
      var code = err && err.code;
      if(code==="invalid_argument" || code==="not_granted" || code==="revoked"){ mode="readonly"; render(); return; }
      lastErr = code==="quota_exceeded" ? "The plan is full. Delete some finished tasks, then try again." : "Couldn’t save that change. Check your connection and try it again.";
      setSave("error");
    });
  }
  function updateDoc(path, data){ write(path, function(ref){ return ref.update(data); }); }
  function setDoc(path, data){ write(path, function(ref){ return ref.set(data); }); }
  function deleteDoc(path){ write(path, function(ref){ return ref.delete(); }); }
  function clean(o){ var c={}; Object.keys(o).forEach(function(k){ if(k!=="id" && o[k]!==undefined) c[k]=o[k]; }); return c; }
  // Typing in a name, section or notes field writes once per pause.
  function queueField(p, f){
    var key = p.id+"/"+f; clearTimeout(fieldTimers[key]); setSave("saving");
    fieldTimers[key] = setTimeout(function(){ delete fieldTimers[key]; var o={}; o[f]=p[f]; updateDoc("pages/"+p.id, o); }, 700);
  }

  /* ---------- render ---------- */
  function editingText(){
    var a = document.activeElement;
    return a && document.getElementById('app').contains(a) && (a.tagName==="TEXTAREA" || (a.tagName==="INPUT" && a.type!=="date"));
  }
  var soRequested = {};
  function ensureSignoff(p){
    var id = signoffId(p.id); if(taskById(id) || soRequested[id] || ro()) return;
    soRequested[id] = true;
    var nt = {id:id, kind:"signoff", title:"Review and sign off "+p.name, assignee:"", parts:[], pages:[p.id], due:"", done:false, created:Date.now(), source:"team"};
    state.tasks.push(nt); setDoc("tasks/"+id, clean(nt));
  }
  function ensureSignoffs(){ if(mode!=="live") return; state.pages.forEach(function(p){ if(pillarsDone(p)) ensureSignoff(p); }); }
  function liveRender(){ if(editingText()){ deferred = true; return; } rerender(); }
  document.addEventListener('focusout', function(){ setTimeout(function(){ if(deferred && !editingText()){ deferred=false; rerender(); } }, 0); });

  function render(){
    var pages = state.pages, m = curMeeting(), wl = weekPages(m);
    var good = wl.filter(function(p){var s=stage(p); return s==="ready"||s==="signed"||s==="live";}).length;
    var work = wl.filter(function(p){return stage(p)==="work";}).length;
    var check = wl.filter(function(p){return stage(p)==="review";}).length;
    var pctW = wl.length ? Math.round(good/wl.length*100) : 0;
    var signedN = pages.filter(function(p){return stage(p)==="signed";}).length, liveN = pages.filter(function(p){return stage(p)==="live";}).length;
    document.body.classList.toggle('ro', ro());

    var h = '<header class="band"><div class="wrap">';
    h += '<div class="hero"><div><h1>Website project plan</h1><p>Each Wednesday we pick the pages to work on. From Thursday to Tuesday, Viviana checks the images and how each page looks and Matias checks the copy. On Wednesday we sign off what’s ready and pick the next week’s pages.</p></div>';
    h += '<div class="overall"><div class="num">'+wl.length+'</div><div class="lbl">page'+(wl.length===1?'':'s')+' this week<br>meeting '+(m===today()?'today':fmtLong(m))+'</div></div></div>';
    h += '<div class="meter" role="progressbar" aria-label="This week’s pages good to go" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pctW+'"><span style="width:'+pctW+'%"></span></div>';
    h += '<div class="counts"><div><b>'+good+'</b><span>good to go</span></div><div><b>'+work+'</b><span>need work</span></div><div><b>'+check+'</b><span>being checked</span></div><div><b>'+signedN+'</b><span>signed off overall</span></div><div><b>'+liveN+'</b><span>live</span></div></div>';
    h += '<div class="tabs" role="tablist">';
    [["week","This week ("+wl.length+")"],["pages","All pages ("+pages.length+")"],["calendar","Calendar"],["sitemap","Site map"]].forEach(function(t){ h += '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(ui.tab===t[0])+'">'+t[1]+'</button>'; });
    h += '</div></div></header><main class="wrap">';
    if(mode==="offline") h += '<p class="notice">This plan’s pages are stored with the artifact. Open it in Claude, signed in, to see and edit them.</p>';
    else if(mode==="pending" && !(loaded.pages && loaded.tasks)) h += '<p class="notice">Loading the plan…</p>';
    h += ui.tab==="week" ? renderWeek() : ui.tab==="pages" ? renderPages() : ui.tab==="sitemap" ? renderSitemap() : renderCalendar();
    h += '</main>';
    document.getElementById('app').innerHTML = h;
    setSave();
  }
  function toolbar(inner){return '<div class="toolbar">'+inner+'<div class="save" id="save" role="status"><i></i><span></span></div></div>';}
  function confirmBtn(key, cls, label, act){
    var on = ui.confirm===key;
    return '<button class="'+cls+(on?' confirming':'')+'" data-act="'+act+'" data-key="'+esc(key)+'">'+(on?'Click again to confirm':label)+'</button>';
  }

  /* ---------- pages ---------- */
  function byDate(a,b){ if((a.goLive||"")===(b.goLive||"")) return (a.order||0)-(b.order||0); if(!a.goLive) return 1; if(!b.goLive) return -1; return a.goLive<b.goLive?-1:1; }
  var PAGE_STAGE_FILTERS = [["all","All"],["review","Being checked"],["work","Needs work"],["ready","Ready to sign off"],["notbuilt","Not built yet"],["signed","Signed off"],["live","Live"]];
  function renderPages(){
    var pages = state.pages, h = '', cnt = {};
    pages.forEach(function(p){ var s=stage(p); cnt[s]=(cnt[s]||0)+1; });
    var f = '<div class="seg" role="group" aria-label="Show pages">';
    PAGE_STAGE_FILTERS.forEach(function(x){ var n = x[0]==="all"?pages.length:(cnt[x[0]]||0); f += '<button data-filter="'+x[0]+'" aria-pressed="'+(ui.filter===x[0])+'">'+x[1]+' ('+n+')</button>'; });
    h += toolbar(f+'</div>');
    var shown = pages.filter(function(p){return ui.filter==="all"||stage(p)===ui.filter;}).slice().sort(function(a,b){ return STAGE_ORDER.indexOf(stage(a))-STAGE_ORDER.indexOf(stage(b)) || byDate(a,b); });
    h += '<div style="height:8px"></div>' + pageList(shown, pages.length?'No pages here right now.':'No pages yet. Add your first one below.');
    h += '<form class="add" id="addPage" autocomplete="off">';
    h += '<input class="field" id="newName" placeholder="Add a page, e.g. Packaging EPR service" aria-label="New page name">';
    h += '<input class="field sec" id="newSec" placeholder="Section" aria-label="Section" list="secs">';
    h += '<input class="field sec" id="newDate" type="date" aria-label="Go-live date">';
    h += '<datalist id="secs">'+sections().map(function(s){return '<option value="'+esc(s)+'">';}).join('')+'</datalist>';
    h += '<button class="primary" type="submit">Add page</button></form>';
    return h;
  }
  function pageList(items, emptyMsg){
    if(!items.length) return '<div class="empty">'+esc(emptyMsg)+'</div>';
    var r0 = ro(), cm = curMeeting();
    return '<div class="list">'+items.map(function(p){
      var st = stage(p), cls = (st==="signed"||st==="live")?" done":(st==="notbuilt")?"":" prog";
      var r = '<article class="row'+cls+(ui.open[p.id]?' open':'')+'" data-id="'+esc(p.id)+'" id="page-'+esc(p.id)+'">';
      r += '<div class="row-main"><div class="name">';
      r += '<input data-field="name" value="'+esc(p.name)+'" aria-label="Page name" '+(r0?'readonly':'')+'>';
      r += '<div class="meta"><input data-field="section" value="'+esc(p.section||"")+'" placeholder="Section" aria-label="Section" list="secs" '+(r0?'readonly':'')+'>';
      r += '<label class="golive">Go-live <input type="date" data-field="goLive" value="'+esc(p.goLive||"")+'" aria-label="Go-live date for '+esc(p.name)+'" '+(r0?'readonly':'')+'></label>';
      if(pageLate(p)) r += '<span class="late-tag">Go-live date passed</span>';
      if(reviewHref(p.reviewUrl)) r += reviewLink(p.reviewUrl,"Review copy");
      if(p.url && /^https:\/\//.test(p.url)) r += '<a class="pageurl" href="'+esc(p.url)+'" target="_blank" rel="noopener">Live page</a>';
      r += '<button class="link" data-act="toggle-open" aria-expanded="'+!!ui.open[p.id]+'">'+(p.notes?'Notes':'Add notes')+'</button></div></div>';
      r += '<div class="pstate">'+stageChip(p);
      if(st!=="notbuilt" && st!=="signed" && st!=="live") r += '<div class="lanechips">'+LANES.map(function(L){ var ls=laneState(p,L.k); return '<span class="lc l-'+ls+'" title="'+esc(L.title+' ('+L.who+')')+'">'+av(L.who)+esc(L.k==="look"?"Look":"Copy")+': '+esc(LSTATES.filter(function(x){return x[0]===ls;})[0][1])+'</span>'; }).join('')+'</div>';
      if(st!=="signed" && st!=="live"){
        var inWk = p.week===cm;
        r += r0 ? (inWk?'<span class="hint">In this week</span>':'') : '<button class="chip'+(inWk?' on':'')+'" data-act="week-toggle" aria-pressed="'+inWk+'">'+(inWk?'In this week':'Add to this week')+'</button>';
        if(p.week && p.week!==cm) r += '<span class="hint">Week to '+fmtDate(p.week)+'</span>';
      }
      r += '</div></div>';
      r += '<div class="extra">';
      r += '<textarea data-field="notes" placeholder="Notes, links, who’s waiting on what…" aria-label="Notes for '+esc(p.name)+'" '+(r0?'readonly':'')+'>'+esc(p.notes||"")+'</textarea>';
      r += '<div class="actions">'+(r0?'':confirmBtn("page:"+p.id,"danger","Remove page","delete"))+'</div></div>';
      return r + '</article>';
    }).join('')+'</div>';

  function taskCard(t){

      ps.forEach(function(p){ h += '<button class="chip" data-dpage="'+esc(p.id)+'" aria-pressed="false">'+esc(p.name)+(p.goLive?' <small>'+fmtDate(p.goLive)+'</small>':'')+'</button>'; });

  // Updates the composer in place so typing in the title never loses focus.
  function syncComposer(){
    var c = document.getElementById('composer'); if(!c) return;
    var d = ui.draft, s = sel(d);
    c.querySelectorAll('[data-dpart]').forEach(function(b){ b.setAttribute('aria-pressed', s.parts.indexOf(b.dataset.dpart)>=0); });
    c.querySelectorAll('[data-dpage]').forEach(function(b){ b.setAttribute('aria-pressed', s.pages.indexOf(b.dataset.dpage)>=0); });
    c.querySelectorAll('[data-act="sec-all"]').forEach(function(b){
      var ids = state.pages.filter(function(p){return (p.section||"Other")===b.dataset.sec;}).map(function(p){return p.id;});
      b.textContent = ids.every(function(id){return s.pages.indexOf(id)>=0;}) ? 'Clear' : 'Select all';
    });
    document.getElementById('allparts').textContent = s.parts.length===3 ? 'Clear' : 'Select all three';
    document.getElementById('pagecount').textContent = 'Pages it covers ('+s.pages.length+' selected)';
    var det = s.det, msg = [];
    if(det.pages.length) msg.push('Linked from the title: '+det.pages.map(function(id){return pageById(id).name;}).join(', '));
    if(det.parts.length && det.pages.length) msg.push('completes '+det.parts.map(function(p){return PART_SHORT[p].toLowerCase();}).join(', '));
    document.getElementById('detect').textContent = msg.join('; ');
    var du = taskDue({pages:s.pages, due:d.due}), dw = document.getElementById('duewrap');
    var want = du.derived ? 'derived' : 'manual';
    if(dw.dataset.mode!==want || want==='derived'){
      dw.dataset.mode = want;
      dw.innerHTML = du.derived
        ? '<div class="duebox">'+esc(fmtDate(du.date))+', when '+esc(du.from.join(' and '))+' go'+(du.from.length>1?'':'es')+' live</div>'
        : '<input class="field" id="draft-due" style="width:100%" type="date" data-draft="due" value="'+esc(d.due)+'" title="Used only until one of its pages has a go-live date">';
    }

    hint.textContent = det.approval

      : ok

      : 'Name the pages in the title or pick them below, and choose what it completes.';
  }
  function autoTitle(s){
    var verb = s.parts.length===3 ? 'Build the layout, imagery and copy for' : s.parts.length===1 ? {layout:'Do the structure for',imagery:'Find imagery for',copy:'Write copy for'}[s.parts[0]] : 'Complete '+s.parts.map(function(p){return PART_SHORT[p].toLowerCase();}).join(' and ')+' for';
    var names = s.pages.map(pageById).filter(Boolean).map(function(p){return p.name;});

  /* ---------- site map ---------- */
  // Every live page (from the site's sitemap, stored as sitemap/live by Claude), grouped by section, with its plan
  // entry and review copy where there is one. Pages being built that aren't on the site yet are listed at the end.
  var SM_GROUPS = [["","Main pages"],["services","Services"],["compliance","Compliance"],["industries","Sectors"],["case-studies","Case studies"],["articles","Articles"],["impact-reports","Reports"],["about-us","About us"],["careers","Careers"]];
  function normUrl(u){return String(u||"").replace(/[?#].*$/,"").replace(/\/+$/,"").toLowerCase();}
  function smLinks(p, url){
    var r = '';
    if(p) r += '<button class="tag pg" data-goto="'+esc(p.id)+'" title="Open this page in the plan">In the plan · '+STAGES[stage(p)]+'</button>';
    if(p && reviewHref(p.reviewUrl)) r += reviewLink(p.reviewUrl,"Review copy");
    if(url && /^https:\/\//.test(url)) r += '<a class="pageurl" href="'+esc(url)+'" target="_blank" rel="noopener">Live page</a>';
    return r;
  }
  function renderSitemap(){
    var sm = state.sitemap, h = '';
    var f = '<div class="seg" role="group" aria-label="Show which pages">';
    [["all","All pages"],["plan","In the plan"],["review","With a review copy"]].forEach(function(x){ f += '<button data-smf="'+x[0]+'" aria-pressed="'+(ui.smFilter===x[0])+'">'+x[1]+'</button>'; });
    h += toolbar(f+'</div>');
    if(!sm || !sm.pages){ return h + '<div class="empty">The site map hasn’t been loaded yet. Ask Claude to refresh it.</div>'; }
    var byUrl = {}; state.pages.forEach(function(p){ if(p.url) byUrl[normUrl(p.url)] = p; });
    var live = {}, rows = sm.pages.map(function(x){ var u = normUrl(x.url); live[u] = true; return {url:x.url, title:x.title, path:(x.url.replace(/^https?:\/\/[^\/]+/,"")||"/"), p:byUrl[u]}; });
    function keep(r){ return ui.smFilter==="all" || (ui.smFilter==="plan" && r.p) || (ui.smFilter==="review" && r.p && r.p.reviewUrl); }
    var inPlan = rows.filter(function(r){return r.p;}).length, withRev = rows.filter(function(r){return r.p && r.p.reviewUrl;}).length;
    h += '<p class="hint">'+rows.length+' live pages, '+inPlan+' in the plan, '+withRev+' with a review copy. From the site map'+(sm.updated?' on '+esc(fmtDate(sm.updated)):'')+'.</p>';
    var keys = SM_GROUPS.map(function(g){return g[0];});
    SM_GROUPS.forEach(function(g){
      var list = rows.filter(function(r){ var seg = r.path.split("/")[1]||""; return (keys.indexOf(seg)>=0 ? seg : "")===g[0] && keep(r); });
      if(!list.length) return;
      h += '<h2 class="group-title">'+esc(g[1])+' ('+list.length+')</h2><div class="list">';
      list.forEach(function(r){
        h += '<div class="smrow"><div class="smname"><b>'+esc(r.p ? r.p.name : (r.title || r.path))+'</b><span>'+esc(r.path)+'</span></div><div class="smlinks">'+smLinks(r.p, r.url)+'</div></div>';
      });
      h += '</div>';
    });
    // Pages in the plan that aren't on the live site yet (built or only planned), with their planned address if set.
    var fresh = state.pages.filter(function(p){ return (!p.url || !live[normUrl(p.url)]) && p.section!=="Fixes" && (ui.smFilter!=="review" || p.reviewUrl); });
    if(fresh.length){
      h += '<h2 class="group-title">New pages, not on the site yet ('+fresh.length+')</h2><div class="list">';
      fresh.forEach(function(p){ var where = p.plannedUrl ? String(p.plannedUrl).replace(/^https?:\/\/[^\/]+/,"")+' (planned)' : (p.section||""); h += '<div class="smrow"><div class="smname"><b>'+esc(p.name)+'</b><span>'+esc(where)+'</span></div><div class="smlinks">'+smLinks(p, "")+'</div></div>'; });
      h += '</div>';
    }
    return h + '<div style="height:48px"></div>';
  }

  /* ---------- weekly rhythm: Wednesday meeting, Thursday to Tuesday work ---------- */
  // A page joins a week by its "week" field: the date of the Wednesday meeting that week ends with.
  // Viviana checks images and look (lookState/lookNote), Matias checks the copy (wordsState/wordsNote).
  var LANES = [
    {k:"look", title:"Images and look", who:"Viviana", ask:"Are the photos right and in frame, and does the page look good on desktop and phone?", ph:"What needs changing? Say which section or photo, e.g. ‘Hero photo is cropped through the faces’."},
    {k:"words", title:"Copy", who:"Matias", ask:"Is the copy accurate, clear and on brand? Any claims we can’t back up?", ph:"What needs changing? Quote the line and say what it should say."}
  ];
  var LSTATES = [["todo","Not checked"],["work","Needs work"],["ok","Good to go"]];
  var STAGES = {notbuilt:"Not built yet", review:"Being checked", work:"Needs work", ready:"Ready to sign off", signed:"Signed off", live:"Live"};
  var STAGE_ORDER = ["work","review","ready","notbuilt","signed","live"];
  function addDays(s,n){ var d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); }
  function meetingOf(s){ var d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+((3-d.getDay()+7)%7)); return iso(d); }
  function curMeeting(){ return meetingOf(today()); }
  function viewMeeting(){ return addDays(curMeeting(), 7*(ui.wk||0)); }
  function laneState(p,k){ var s=p[k+"State"]; return s==="work"||s==="ok" ? s : "todo"; }
  function legacySigned(p){ var t=signoffTask(p); return !!(t && t.done); }
  function isSigned(p){ return p.signedOff===undefined ? legacySigned(p) : !!p.signedOff; }
  function stage(p){
    if(p.isLive) return "live";
    if(isSigned(p)) return "signed";
    if(!reviewHref(p.reviewUrl)) return "notbuilt";
    var a=laneState(p,"look"), b=laneState(p,"words");
    if(a==="work"||b==="work") return "work";
    if(a==="ok"&&b==="ok") return "ready";
    return "review";
  }
  function stageChip(p){ var s=stage(p); return '<span class="stage s-'+s+'">'+STAGES[s]+'</span>'; }
  function weekPages(m){ return state.pages.filter(function(p){return p.week===m;}).sort(function(a,b){ return STAGE_ORDER.indexOf(stage(a))-STAGE_ORDER.indexOf(stage(b)) || (a.order||0)-(b.order||0); }); }
  function photoBrief(p){ var t=taskById("std-"+p.id+"-images"); return t && t.note ? String(t.note).replace(/\s*The See the page button[^.]*\.\s*Send (it|them|the images) to Claude to place\.?/i,"").trim() : ""; }
  function workDaysLeft(m){ var n=0, d=today(); var end=addDays(m,-1); while(d<=end){ var w=new Date(d+"T00:00:00").getDay(); if(w>0&&w<6) n++; d=addDays(d,1); } return n; }
  function fmtStamp(ms){ if(!ms) return ""; var d=new Date(ms); return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}); }

  function weekStrip(m){
    var h='<ol class="strip" aria-label="This week’s rhythm">', t=today();
    for(var i=-6;i<=0;i++){
      var d=addDays(m,i), dt=new Date(d+"T00:00:00"), meet=i===0;
      var lbl = meet ? "Meeting" : (dt.getDay()===0||dt.getDay()===6) ? "Weekend" : "Work";
      h+='<li class="'+(meet?'meet':'')+(d===t?' now':'')+(d<t?' past':'')+'"><b>'+dt.toLocaleDateString("en-GB",{weekday:"short"})+' '+dt.getDate()+'</b><span>'+lbl+'</span></li>';
    }
    return h+'</ol>';
  }

  function laneBox(p,L){
    var st=laneState(p,L.k), mine=ui.me===L.who, r0=ro();
    var h='<section class="lane l-'+st+(mine?' mine':'')+'" aria-label="'+esc(L.title+' check for '+p.name)+'">';
    h+='<div class="lane-h">'+av(L.who)+'<b>'+esc(L.title)+'</b><span>'+esc(L.who)+(mine?' (you)':'')+'</span></div>';
    h+='<p class="ask">'+esc(L.ask)+'</p>';
    if(L.k==="look"){ var br=photoBrief(p); if(br) h+='<p class="brief"><b>Photos:</b> '+esc(br)+'</p>'; }
    h+='<div class="states" role="group" aria-label="'+esc(L.title)+' result">';
    LSTATES.forEach(function(s){ h+='<button class="st-'+s[0]+'" data-lane="'+L.k+'" data-ls="'+s[0]+'" aria-pressed="'+(st===s[0])+'" '+(r0?'disabled':'')+'>'+s[1]+'</button>'; });
    h+='</div>';
    var nf=L.k+"Note";
    h+='<textarea data-field="'+nf+'" rows="2" placeholder="'+esc(L.ph)+'" aria-label="'+esc(L.title+' notes for '+p.name)+'" '+(r0?'readonly':'')+'>'+esc(p[nf]||"")+'</textarea>';
    if(p[L.k+"By"]) h+='<p class="by">'+esc(LSTATES.filter(function(s){return s[0]===st;})[0][1])+', marked by '+esc(p[L.k+"By"])+(p[L.k+"At"]?' on '+fmtStamp(p[L.k+"At"]):'')+'</p>';
    return h+'</section>';
  }

  function weekCard(p){
    var s=stage(p), r0=ro();
    var h='<article class="wk s-'+s+'" data-id="'+esc(p.id)+'" id="wk-'+esc(p.id)+'">';
    h+='<div class="wk-head"><div class="wk-title"><h3>'+esc(p.name)+'</h3><span class="hint">'+esc(p.section||"")+(p.goLive?' · go-live '+fmtDate(p.goLive):'')+'</span></div>'+stageChip(p)+'</div>';
    h+='<div class="wk-links">';
    if(reviewHref(p.reviewUrl)) h+=reviewLink(p.reviewUrl,"Open the page to check");
    else h+='<span class="review-off">No built page to check yet</span>';
    if(p.url && /^https:\/\//.test(p.url)) h+='<a class="pageurl" href="'+esc(p.url)+'" target="_blank" rel="noopener">Current live page</a>';
    h+='</div>';
    if(s==="notbuilt") h+='<p class="wk-note">This page hasn’t been built yet. Ask Claude to build the first draft, then it can be checked here.</p>';
    else if(s!=="live" && s!=="signed") h+='<div class="lanes">'+LANES.map(function(L){return laneBox(p,L);}).join('')+'</div>';
    h+='<div class="wk-foot">';

  /* ---------- calendar ---------- */
  function renderCalendar(){
    var t = new Date(), m = ui.month || (t.getFullYear()+"-"+pad(t.getMonth()+1));
    var y = +m.slice(0,4), mo = +m.slice(5,7)-1;
    var h = toolbar('<div class="calhead"><button data-cal="-1" aria-label="Previous month">‹</button><h2>'+MONTHS[mo]+' '+y+'</h2><button data-cal="1" aria-label="Next month">›</button><button data-cal="0">Today</button></div>');
    var byDay = {};
    function add(date, html){ (byDay[date]=byDay[date]||[]).push(html); }
    state.pages.forEach(function(p){
      if(!p.goLive) return;
      var st=stage(p), cls = pageLate(p)?' late':(st==="signed"||st==="live")?' done':(st==="notbuilt")?'':' prog';
      add(p.goLive, '<button class="ev'+cls+'" data-goto="'+esc(p.id)+'" title="'+esc(p.name+' goes live: '+STAGES[st])+'">'+esc(p.name)+' <small>go-live</small></button>');
    });
    // Every Wednesday is the team meeting; show how many pages that week has.
    var cm = curMeeting(), first0 = new Date(y,mo,1), d0 = iso(first0), lastD = iso(new Date(y,mo+1,0));
    for(var w = meetingOf(addDays(d0,-7)); w <= addDays(lastD,7); w = addDays(w,7)){
      var n = state.pages.filter(function(p){return p.week===w;}).length, off = Math.round((new Date(w+"T00:00:00")-new Date(cm+"T00:00:00"))/604800000);
      var lbl = 'Team meeting'+(n?' · '+n+' page'+(n>1?'s':''):'');
      add(w, (off===0||off===1) ? '<button class="ev meet" data-gowk="'+off+'">'+lbl+'</button>' : '<span class="ev meet">'+lbl+'</span>');
    }
    var first = new Date(y,mo,1), start = new Date(y,mo,1-((first.getDay()+6)%7));
    h += '<div class="cal" role="grid" aria-label="Meetings and go-live calendar">';
    ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function(dn){ h += '<div class="dow">'+dn+'</div>'; });
    for(var i=0;i<42;i++){
      var d = new Date(start.getFullYear(),start.getMonth(),start.getDate()+i), k = iso(d);
      if(i===35 && d.getMonth()!==mo) break;
      h += '<div class="day'+(d.getMonth()!==mo?' out':'')+(k===today()?' today':'')+'"><span class="dn">'+d.getDate()+'</span>'+(byDay[k]||[]).join('')+'</div>';
    }
    h += '</div>';
    var keys = Object.keys(byDay).filter(function(k){return k.slice(0,7)===m;}).sort();
    h += '<div class="agenda">'+(keys.length?keys.map(function(k){return '<div><div class="ad">'+fmtLong(k)+'</div>'+byDay[k].join('')+'</div>';}).join(''):'<div class="empty">No meetings or go-live dates this month.</div>')+'</div>';
    var und = state.pages.filter(function(p){var st=stage(p); return !p.goLive && st!=="signed" && st!=="live";});
    if(und.length) h += '<div class="undated"><h2 class="group-title">No go-live date yet ('+und.length+')</h2><div class="chips">'+und.map(function(p){return '<button class="chip" data-goto="'+esc(p.id)+'">'+esc(p.name)+'</button>';}).join('')+'</div></div>';
    return h + '<div style="height:48px"></div>';
  }

      var fresh = snap.docs.map(function(d){ var o = {}; var data = d.data()||{}; Object.keys(data).forEach(function(k){ o[k] = Array.isArray(data[k]) ? data[k].slice() : data[k]; }); o.id = d.id; return o; });
      // Keep what someone is typing right now, until their pause writes it.
      if(name==="pages") Object.keys(fieldTimers).forEach(function(key){ var parts=key.split("/"), mine=pageById(parts[0]), f=parts[1]; fresh.forEach(function(p){ if(mine && p.id===mine.id && fieldTimers[key]) p[f]=mine[f]; }); });
      state[name] = fresh; loaded[name] = true;
      if(mode==="pending" && loaded.pages && loaded.tasks) mode="live";
      liveRender();
    }, function(err){
      if(err && err.code==="revoked"){ mode="readonly"; }
      else { lastErr="Lost the live connection. Reload the page to reconnect."; setSave("error"); }
      liveRender();
    });
  }

  /* ---------- review copy viewer: opens reviews/<page>.html inside the plan ---------- */
  var rvEl=null, rvLast=null;
  function closeReview(){ if(rvEl){ rvEl.remove(); rvEl=null; document.documentElement.style.overflow=""; if(/^#review-/.test(location.hash)) { try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){ location.hash=""; } } if(rvLast && rvLast.focus) rvLast.focus(); } }
  function openReview(href){
    if(!/^reviews\/[a-z0-9-]+\.html$/.test(href)) return;
    closeReview(); rvLast=document.activeElement;
    var slug=href.slice(8,-5);
    rvEl=document.createElement("div"); rvEl.className="rv"; rvEl.setAttribute("role","dialog"); rvEl.setAttribute("aria-modal","true"); rvEl.setAttribute("aria-label","Review copy");
    rvEl.innerHTML='<div class="rv-bar"><b>Review copy: '+esc(slug.replace(/-/g," "))+'</b><button type="button" data-rvclose="1">Back to the plan</button></div><div class="rv-msg">Loading the page…</div>';
    document.body.appendChild(rvEl); document.documentElement.style.overflow="hidden";
    rvEl.querySelector("button").focus();
    if(location.hash!=="#review-"+slug){ try{ history.replaceState(null,"","#review-"+slug); }catch(e){} }
    var mine=rvEl;
    fetch(href).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); }).then(function(html){
      if(rvEl!==mine) return;
      html=html.replace(/<script[\s\S]*?<\/script>/gi,"").replace(/<head([^>]*)>/i,'<head$1><base target="_blank">');
      var f=document.createElement("iframe"); f.title="Review copy of "+slug.replace(/-/g," ");
      f.setAttribute("sandbox","allow-popups allow-popups-to-escape-sandbox"); f.srcdoc=html;
      var m=rvEl.querySelector(".rv-msg"); m.replaceWith(f);
    }).catch(function(){ if(rvEl!==mine) return; rvEl.querySelector(".rv-msg").textContent="This review copy couldn't be loaded. Reload the plan and try again."; });
  }
  document.addEventListener("click", function(e){
    var a=e.target.closest("a[data-review]");
    if(a){ e.preventDefault(); openReview(a.getAttribute("data-review")); return; }
    if(e.target.closest("[data-rvclose]")){ e.preventDefault(); closeReview(); }
  }, true);
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && rvEl) closeReview(); });
  function reviewFromHash(){ var m=/^#review-([a-z0-9-]+)$/.exec(location.hash); if(m) openReview("reviews/"+m[1]+".html"); else if(rvEl) closeReview(); }
  window.addEventListener("hashchange", reviewFromHash);
  reviewFromHash();
  var claudeApi = window.claude;
  if(claudeApi && typeof claudeApi.use==="function"){
    claudeApi.use("db").then(function(d){
      if(!d){ mode="offline"; render(); return; }
      db = d; subscribe("pages"); subscribe("tasks");
      db.collection("sitemap").onSnapshot(function(snap){
        var doc = snap.docs.filter(function(x){return x.id==="live";})[0];
        state.sitemap = doc ? doc.data() : null; liveRender();
      }, function(){});
    }).catch(function(){ mode="offline"; render(); });
  } else { mode="offline"; render(); }
})();
</script>
